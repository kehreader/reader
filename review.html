<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | AUTHOR'S ATELIER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181c;--surface:#1c232a;--surface-2:#242c34;--cream:#ede6d6;--cream-dim:#b6ae9c;--gold:#c6a15b;--gold-bright:#e0c084;--line:rgba(237,230,214,.14);--line-strong:rgba(237,230,214,.28)}
*{box-sizing:border-box} body{margin:0;background:var(--ink);color:var(--cream);font-family:Inter,sans-serif;line-height:1.6} a{color:inherit}.wrap{width:min(900px,calc(100% - 40px));margin:auto}.top{padding:28px 0;border-bottom:1px solid var(--line)}.brand{font-family:Fraunces,serif;font-size:1.25rem}.brand span{color:var(--gold)} main{padding:80px 0}.eyebrow{font-family:'Courier Prime',monospace;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}h1{font-family:Fraunces,serif;font-size:clamp(2.3rem,6vw,4.2rem);font-weight:500;line-height:1.05;margin:12px 0 18px} .intro{color:var(--cream-dim);max-width:650px;margin-bottom:38px}.form-card{background:var(--surface);border:1px solid var(--line);padding:32px;border-radius:3px}label{display:block;font-size:.85rem;margin-bottom:8px;color:var(--cream)}input,select,textarea{width:100%;background:var(--surface-2);color:var(--cream);border:1px solid var(--line-strong);padding:13px 14px;border-radius:2px;font:inherit;margin-bottom:22px}textarea{min-height:150px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}.rating{display:flex;gap:8px;margin:0 0 24px}.rating input{display:none}.rating label{font-size:1.7rem;color:var(--cream-dim);cursor:pointer;margin:0}.rating input:checked ~ label,.rating label:hover,.rating label:hover ~ label{color:var(--gold)}button{border:0;background:var(--gold);color:var(--ink);padding:13px 22px;font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:2px}button:hover{background:var(--gold-bright)}button:disabled{opacity:.6;cursor:not-allowed}.status{margin-top:18px;color:var(--cream-dim);min-height:24px}.back{display:inline-block;margin-top:28px;color:var(--gold);text-decoration:none;font-family:'Courier Prime',monospace;font-size:.8rem}@media(max-width:600px){.wrap{width:min(100% - 28px,900px)}main{padding:55px 0}.form-card{padding:22px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">AUTHOR'S ATELIER <span>·</span> Editorial Studio</div></div></header>
<main><div class="wrap">
<span class="eyebrow">Your experience matters</span>
<h1>Leave a Review</h1>
<p class="intro">If you've worked with AUTHOR'S ATELIER, you can share your experience below. Your review will be checked before it appears on the portfolio.</p>
<div class="form-card">
<form id="review-form">
<label for="name">Your name</label>
<input id="name" name="name" type="text" maxlength="100" required>
<label for="book">Book / project</label>
<input id="book" name="book" type="text" maxlength="150" required>
<label for="service">Service</label>
<select id="service" name="service" required>
<option value="">Select a service</option><option>Beta Reading</option><option>Developmental & Line Editing</option><option>Cover Design</option><option>Book Marketing</option><option>AI Cinematic Video Creation</option><option>Author Website Creation</option><option>Book Launch Support</option><option>Author Branding</option><option>Book Landing Page</option><option>Proofreading</option><option>Book Trailer Creation</option><option>Book Mockup Creation</option><option>Print Book Formatting</option><option>Google Business Profile Setup</option>
</select>
<label>Rating</label>
<div class="rating" aria-label="Choose a rating">
 <label><input type="radio" name="rating" value="1" required>★</label>
  <label><input type="radio" name="rating" value="2">★</label>
  <label><input type="radio" name="rating" value="3">★</label>
  <label><input type="radio" name="rating" value="4">★</label>
  <label><input type="radio" name="rating" value="5">★</label>
</div>
<label for="review">Your review</label>
<textarea id="review" name="review" maxlength="1200" required placeholder="Tell us briefly about your experience..."></textarea>
<button type="submit" id="submit-review">Submit Review</button>
<div class="status" id="status" role="status"></div>
</form>
</div>
<a class="back" href="portfolio.html">← Back to portfolio</a>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vwfukfgmsftluxpgwhsv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NPnMlf81-jMQ7TQOuJ9RvA_3l_tmjLA";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById("review-form");
const status=document.getElementById("status");
const submit=document.getElementById("submit-review");
form.addEventListener("submit",async function(e){
  e.preventDefault();
  submit.disabled=true; status.textContent="Submitting your review...";
  const formData=new FormData(form);
  const payload={name:String(formData.get("name")).trim(),book:String(formData.get("book")).trim(),service:String(formData.get("service")).trim(),rating:Number(formData.get("rating")),review:String(formData.get("review")).trim()};
  const {error}=await supabaseClient.from("reviews").insert(payload);
  if(error){console.error(error);status.textContent="Your review could not be submitted. Please try again.";submit.disabled=false;return;}
  form.reset(); status.textContent="Thank you. Your review has been submitted and will appear after approval."; submit.disabled=false;
});
</script>
</body>
</html>
